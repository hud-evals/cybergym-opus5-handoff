[project]
name = "cybergym-og-hud"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "cybergym[server]",
  "docker>=7.1,<8",
  "hud==0.6.13",
  "httpx>=0.28,<1",
  "poetry>=2,<3",
  "simple-parsing>=0.1.7,<1",
  "sqlalchemy>=2,<3",
  "tomli-w>=1.2,<2",
]

[project.scripts]
cybergym-hud-run-native = "cybergym_hud.scheduler:main"
cybergym-hud-run-campaign = "cybergym_hud.campaign:main"
cybergym-hud-preflight-catalog = "cybergym_hud.catalog_preflight:main"
cybergym-hud-runtime-network = "cybergym_hud.runtime_network:main"
cybergym-hud-attest-grader = "cybergym_hud.grader_attestation:main"
cybergym-hud-backfill-trace = "cybergym_hud.trace_backfill:main"
cybergym-hud-run-upstream-openhands = "cybergym_hud.upstream:run_openhands"
cybergym-hud-score-upstream = "cybergym_hud.upstream:run_verifier"
cybergym-hud-verify = "cybergym_hud.contract:main"

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cybergym_hud"]

[tool.hatch.build.targets.sdist]
include = ["cybergym_hud", "openhands_shim", "ops", "README.md", "pyproject.toml"]

[tool.uv.sources]
cybergym = { path = "../..", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../..", "../../src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"cybergym_hud/contract.py" = ["S603", "S607"]
"cybergym_hud/upstream.py" = ["S603", "S606", "S607"]
